<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Bassin-Villas — Conciergerie Bassin d'Arcachon</title>
<meta name="description" content="Contactez Bassin-Villas pour la conciergerie ou l'intendance de votre villa sur le Bassin d'Arcachon. Tél : 06 38 22 82 82.">
<link rel="canonical" href="https://bassin-villas.github.io/Arcachon/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="hero tabs-hero">

  <div class="site-header">
    <nav class="tab-bar">
      <a class="tab-btn" href="index.html" data-i18n="tab-accueil">Accueil</a>
      <a class="tab-btn" href="conciergerie.html" data-i18n="tab-conciergerie">Conciergerie</a>
      <a class="tab-btn" href="intendance-villas.html" data-i18n="tab-intendance">Intendance Villas</a>
      <span class="tab-break"></span>
      <a class="tab-btn tab-btn-contact active" href="contact.html" data-i18n="tab-contact">Contact</a>
    </nav>
  </div>

  <button class="lang-btn" id="lang-toggle">EN</button>

  <div class="tab-panel active" id="contact">
    <div class="doc-page">
      <div class="doc-body">
        <h1 class="doc-title" data-i18n="contact-title">Bassin-Villas</h1>
        <p class="doc-tagline" data-i18n="contact-phone">Tél : 06 38 22 82 82</p>
        <p class="doc-tagline" data-i18n="contact-email">bassin.villas@gmail.com</p>

        <details class="accordion" id="contact-accordion">
          <summary data-i18n="contact-summary">Nous contacter</summary>
          <div class="accordion-body accordion-body-form">
            <form id="contact-form" class="contact-form">
              <input type="hidden" name="access_key" value="2e6fceda-72e9-4bb9-b3e9-abe3e7ad0d49">
              <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off">

              <label for="contact-name" data-i18n="label-name">Nom</label>
              <input type="text" id="contact-name" name="name" required>

              <label for="contact-email" data-i18n="label-email">Email</label>
              <input type="email" id="contact-email" name="email" required>

              <label for="contact-phone" data-i18n="label-phone">Téléphone</label>
              <input type="tel" id="contact-phone" name="phone">

              <label for="contact-message" data-i18n="label-message">Message</label>
              <textarea id="contact-message" name="message" rows="5" required></textarea>

              <button type="submit" class="cta" data-i18n="btn-send">Envoyer</button>
            </form>
          </div>
        </details>

        <p id="contact-success" class="contact-feedback contact-success" data-i18n="contact-success">Merci, votre message a bien été envoyé !</p>
        <p id="contact-error" class="contact-feedback contact-error" data-i18n="contact-error">Une erreur est survenue. Réessayez ou appelez-nous directement.</p>
      </div>
    </div>
  </div>

</main>

<script src="i18n.js"></script>
<script>
  var contactForm = document.getElementById('contact-form');
  var contactSuccess = document.getElementById('contact-success');
  var contactError = document.getElementById('contact-error');

  contactForm.addEventListener('submit', function (event) {
    event.preventDefault();
    contactSuccess.classList.remove('visible');
    contactError.classList.remove('visible');

    var submitBtn = contactForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(contactForm)
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        submitBtn.disabled = false;
        if (data.success) {
          contactForm.reset();
          contactSuccess.classList.add('visible');
        } else {
          contactError.classList.add('visible');
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        contactError.classList.add('visible');
      });
  });
</script>

</body>
</html>
